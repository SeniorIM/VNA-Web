<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNA Curve Extractor</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 0; padding: 8px;
            background: #1a1a1a; color: #eee;
        }
        h1 { font-size: 18px; text-align: center; color: #4fc3f7; }
        .card {
            background: #2a2a2a; border-radius: 10px;
            padding: 10px; margin-bottom: 10px; border: 1px solid #444;
        }
        .card h2 { font-size: 14px; margin: 0 0 8px 0; color: #ffd54f; }
        .btn {
            background: #2196f3; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 14px;
            cursor: pointer; width: 100%; margin: 4px 0;
        }
        .btn:active { background: #1976d2; }
        .btn:disabled { background: #555; }
        .btn-success { background: #4caf50; }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }
        .canvas-wrap { width: 100%; overflow: hidden; background: #000; border-radius: 8px; }
        #canvas { display: block; width: 100%; height: auto; }
        .status {
            background: #333; padding: 8px; border-radius: 6px;
            font-size: 12px; text-align: center; margin-top: 6px; color: #4fc3f7;
        }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .inputs label { font-size: 11px; color: #aaa; display: block; }
        .inputs input {
            width: 100%; padding: 8px; border: 1px solid #555;
            border-radius: 6px; background: #1a1a1a; color: #fff; text-align: center;
        }
        #stepInfo {
            font-size: 13px; color: #ffd54f; text-align: center;
            padding: 6px; background: #1a1a1a; border-radius: 6px; margin-top: 6px;
        }
        #plotCanvas { width: 100%; background: #fff; border-radius: 8px; display: block; }
    </style>
</head>
<body>

<h1>📊 VNA Curve Extractor</h1>

<div class="card">
    <h2>مرحله 1: انتخاب تصویر</h2>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInput').click()">
        📷 انتخاب عکس
    </button>
    <div class="status" id="status1">منتظر انتخاب تصویر...</div>
</div>

<div class="card" id="clickCard" style="display:none">
    <h2>مرحله 2: کلیک روی نقاط</h2>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="stepInfo">آماده</div>
    <div style="display:flex; gap:6px; margin-top:6px;">
        <button class="btn btn-warning" onclick="undoLastPoint()" style="flex:1">↩️ لغو</button>
        <button class="btn btn-danger" onclick="resetClicks()" style="flex:1">🔄 شروع مجدد</button>
    </div>
</div>

<div class="card" id="valuesCard" style="display:none">
    <h2>مرحله 3: مقادیر محورها</h2>
    <div class="inputs">
        <div><label>X1 (GHz)</label><input type="number" id="f1" value="8" step="any"></div>
        <div><label>X2 (GHz)</label><input type="number" id="f2" value="12" step="any"></div>
        <div><label>Y1 (dB)</label><input type="number" id="d1" value="0" step="any"></div>
        <div><label>Y2 (dB)</label><input type="number" id="d2" value="-30" step="any"></div>
    </div>
    <button class="btn btn-success" id="extractBtn" onclick="runExtraction()" style="margin-top:10px">
        ⚡ استخراج
    </button>
    <div class="status" id="status3"></div>
</div>

<div class="card" id="resultCard" style="display:none">
    <h2>مرحله 4: نتیجه</h2>
    <div class="status" id="status4"></div>
    <canvas id="plotCanvas" width="800" height="400"></canvas>
    <button class="btn btn-success" onclick="downloadExcel()" style="margin-top:10px">
        💾 دانلود Excel
    </button>
</div>

<script>
const STATE = {
    image: null, imageWidth: 0, imageHeight: 0,
    clickStep: 0, corners: [], xPoints: [], yPoints: [],
    allClicks: [], result: null
};

const STEPS_TEXT = [
    'آماده',
    'گوشه بالا-چپ نمودار',
    'گوشه بالا-راست نمودار',
    'گوشه پایین-راست نمودار',
    'گوشه پایین-چپ نمودار',
    'روی 8 GHz کلیک کنید',
    'روی 12 GHz کلیک کنید',
    'روی 0 dB کلیک کنید',
    'روی -30 dB کلیک کنید',
];

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            STATE.image = img;
            STATE.imageWidth = img.width;
            STATE.imageHeight = img.height;
            window.imageWidth = img.width;
            window.imageHeight = img.height;
            
            const canvas = document.getElementById('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            
            STATE.clickStep = 1;
            STATE.corners = []; STATE.xPoints = []; STATE.yPoints = [];
            STATE.allClicks = [];
            
            document.getElementById('clickCard').style.display = 'block';
            document.getElementById('valuesCard').style.display = 'none';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('status1').textContent = `✅ ${img.width}×${img.height}`;
            document.getElementById('stepInfo').textContent = STEPS_TEXT[1];
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

document.getElementById('canvas').addEventListener('click', function(e) {
    if (STATE.clickStep < 1) return;
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * canvas.width / rect.width;
    const y = (e.clientY - rect.top) * canvas.height / rect.height;
    handleClick(x, y);
});

function handleClick(x, y) {
    const step = STATE.clickStep;
    STATE.allClicks.push({x, y, step});
    let color = 'red', label = '';
    if (step >= 1 && step <= 4) {
        STATE.corners.push({x, y});
        color = ['red', 'green', 'blue', 'orange'][step - 1];
        label = ['TL', 'TR', 'BR', 'BL'][step - 1];
    } else if (step === 5 || step === 6) {
        STATE.xPoints.push({x, y});
        color = 'magenta';
        label = step === 5 ? 'X1' : 'X2';
    } else if (step === 7 || step === 8) {
        STATE.yPoints.push({x, y});
        color = 'cyan';
        label = step === 7 ? 'Y1' : 'Y2';
    }
    drawMarker(x, y, color, label);
    STATE.clickStep++;
    if (STATE.clickStep <= 8) {
        document.getElementById('stepInfo').textContent = STEPS_TEXT[STATE.clickStep];
    }
    if (STATE.clickStep === 7) {
        document.getElementById('valuesCard').style.display = 'block';
    }
    if (STATE.clickStep === 9) {
        document.getElementById('stepInfo').textContent = '✅ همه نقاط آماده!';
    }
}

function drawMarker(x, y, color, label) {
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, 2 * Math.PI);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
    if (label) {
        ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center'; ctx.fillText(label, x, y + 4);
    }
}

function undoLastPoint() {
    if (STATE.allClicks.length === 0) return;
    const last = STATE.allClicks.pop();
    STATE.clickStep = last.step;
    if (last.step >= 1 && last.step <= 4) STATE.corners.pop();
    else if (last.step === 5 || last.step === 6) STATE.xPoints.pop();
    else if (last.step === 7 || last.step === 8) STATE.yPoints.pop();
    const canvas = document.getElementById('canvas');
    canvas.getContext('2d').drawImage(STATE.image, 0, 0);
    redrawAllMarkers();
}

function redrawAllMarkers() {
    for (let i = 0; i < STATE.corners.length; i++) {
        const c = STATE.corners[i];
        drawMarker(c.x, c.y, ['red','green','blue','orange'][i], ['TL','TR','BR','BL'][i]);
    }
    for (let i = 0; i < STATE.xPoints.length; i++) {
        const p = STATE.xPoints[i];
        drawMarker(p.x, p.y, 'magenta', i === 0 ? 'X1' : 'X2');
    }
    for (let i = 0; i < STATE.yPoints.length; i++) {
        const p = STATE.yPoints[i];
        drawMarker(p.x, p.y, 'cyan', i === 0 ? 'Y1' : 'Y2');
    }
}

function resetClicks() {
    STATE.clickStep = 1;
    STATE.corners = []; STATE.xPoints = []; STATE.yPoints = []; STATE.allClicks = [];
    document.getElementById('canvas').getContext('2d').drawImage(STATE.image, 0, 0);
    document.getElementById('stepInfo').textContent = STEPS_TEXT[1];
    document.getElementById('valuesCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
}

async function runExtraction() {
    if (typeof window.process_image !== 'function') {
        document.getElementById('status3').textContent = 
            '⏳ لطفاً ۳۰ ثانیه صبر کنید (نصب پکیج‌ها)';
        return;
    }
    
    document.getElementById('status3').textContent = '⏳ در حال استخراج...';
    document.getElementById('extractBtn').disabled = true;
    try {
        const corners = STATE.corners.map(p => [p.x, p.y]);
        const calib = {
            x1: STATE.xPoints[0].x,
            f1: parseFloat(document.getElementById('f1').value),
            x2: STATE.xPoints[1].x,
            f2: parseFloat(document.getElementById('f2').value),
            y1: STATE.yPoints[0].y,
            d1: parseFloat(document.getElementById('d1').value),
            y2: STATE.yPoints[1].y,
            d2: parseFloat(document.getElementById('d2').value)
        };
        const imgArray = await imageToArray(STATE.image);
        const result = await window.process_image(imgArray, corners, calib);
        STATE.result = result;
        showResult(result);
        document.getElementById('status3').textContent = `✅ ${result.frequency.length} نقطه`;
    } catch (err) {
        console.error(err);
        document.getElementById('status3').textContent = '❌ ' + (err.message || err);
    }
    document.getElementById('extractBtn').disabled = false;
}

function imageToArray(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        const data = imgData.data;
        const arr = new Uint8Array(img.width * img.height * 3);
        for (let i = 0; i < img.width * img.height; i++) {
            arr[i * 3] = data[i * 4];
            arr[i * 3 + 1] = data[i * 4 + 1];
            arr[i * 3 + 2] = data[i * 4 + 2];
        }
        resolve(arr);
    });
}

function showResult(result) {
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('status4').textContent = 
        `${result.frequency.length} نقطه`;
    const canvas = document.getElementById('plotCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, pad = 50;
    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, W, H);
    const xs = result.frequency, ys = result.amplitude;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const yPad = (yMax - yMin) * 0.1 || 1;
    const yLo = yMin - yPad, yHi = yMax + yPad;
    const px = (x) => pad + (x - xMin) / (xMax - xMin) * (W - 2 * pad);
    const py = (y) => H - pad - (y - yLo) / (yHi - yLo) * (H - 2 * pad);
    ctx.strokeStyle = '#ccc';
    for (let i = 0; i <= 5; i++) {
        const y = yLo + (yHi - yLo) * i / 5;
        ctx.beginPath(); ctx.moveTo(pad, py(y)); ctx.lineTo(W - pad, py(y)); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'right';
        ctx.fillText(y.toFixed(1), pad - 5, py(y) + 4);
    }
    for (let i = 0; i <= 4; i++) {
        const x = xMin + (xMax - xMin) * i / 4;
        ctx.beginPath(); ctx.moveTo(px(x), pad); ctx.lineTo(px(x), H - pad); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.textAlign = 'center';
        ctx.fillText(x.toFixed(2), px(x), H - pad + 15);
    }
    ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), py(ys[0]));
    for (let i = 1; i < xs.length; i++) ctx.lineTo(px(xs[i]), py(ys[i]));
    ctx.stroke();
}

function downloadExcel() {
    if (!STATE.result) return;
    const xs = STATE.result.frequency;
    const ys = STATE.result.amplitude;
    const data = [['Frequency_GHz', 'Amplitude_dB']];
    for (let i = 0; i < xs.length; i++) data.push([xs[i], ys[i]]);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 18 }, { wch: 18 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Curve');
    XLSX.writeFile(wb, 'vna_curve.xlsx');
}
</script>

<!-- ===== پیکربندی PyScript - این بخش حیاتی است ===== -->
<py-config>
packages = ["numpy", "opencv-python", "pandas", "openpyxl", "scipy"]
</py-config>

<script type="py" src="./main.py"></script>

</body>
</html>
