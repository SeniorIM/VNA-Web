<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNA Curve Extractor</title>
    <link rel="icon" href="data:,">

    <!-- PyScript لوکال -->
    <link rel="stylesheet" href="./libs/pyscript/core.css">
    <script type="module" src="./libs/pyscript/core.js"></script>

    <!-- SheetJS لوکال -->
    <script src="./libs/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 0; padding: 8px;
            background: #1a1a1a; color: #eee;
            font-size: 16px;
        }
        h1 { font-size: 24px; text-align: center; color: #4fc3f7; margin: 10px 0; }
        .card {
            background: #2a2a2a; border-radius: 10px;
            padding: 12px; margin-bottom: 10px; border: 1px solid #444;
        }
        .card h2 { font-size: 18px; margin: 0 0 10px 0; color: #ffd54f; }
        .btn {
            background: #2196f3; color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px;
            cursor: pointer; width: 100%; margin: 4px 0;
        }
        .btn:active { background: #1976d2; }
        .btn:disabled { background: #555; }
        .btn-success { background: #4caf50; }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }

        .canvas-wrap {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }
        #canvas { display: block; width: 100%; height: auto; }

        .status {
            background: #333; padding: 10px; border-radius: 6px;
            font-size: 15px; text-align: center; margin-top: 6px; color: #4fc3f7;
        }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .inputs label { font-size: 14px; color: #aaa; display: block; margin-bottom: 4px; }
        .inputs input, .inputs select {
            width: 100%; padding: 10px; border: 1px solid #555;
            border-radius: 6px; background: #1a1a1a; color: #fff;
            text-align: center; font-size: 15px;
        }
        #stepInfo {
            font-size: 16px; color: #ffd54f; text-align: center;
            padding: 8px; background: #1a1a1a; border-radius: 6px; margin-top: 8px;
        }
        #plotCanvas { width: 100%; background: #fff; border-radius: 8px; display: block; }

        /* === پنل وضعیت کتابخانه‌ها === */
        #libStatusPanel {
            background: #0d1b2a;
            border: 1px solid #1b4965;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        #libStatusPanel .lib-header {
            display: flex; justify-content: space-between; align-items: center;
            color: #4fc3f7; font-weight: bold; margin-bottom: 8px;
            font-size: 16px;
        }
        #libStatusPanel .lib-list {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        .lib-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 4px;
            background: #1a2a3a; font-size: 14px;
        }
        .lib-item.ok { color: #4caf50; }
        .lib-item.loading { color: #ffd54f; }
        .lib-item.error { color: #f44336; }
        .lib-item.pending { color: #888; }
        .lib-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #888; flex-shrink: 0;
        }
        .lib-item.ok .lib-dot { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .lib-item.loading .lib-dot { background: #ffd54f; animation: pulse 1s infinite; }
        .lib-item.error .lib-dot { background: #f44336; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #globalStatus {
            text-align: center; font-weight: bold; padding: 8px;
            margin-top: 10px; border-radius: 6px; font-size: 15px;
        }
        #globalStatus.waiting { color: #ffd54f; background: #3a2a1a; }
        #globalStatus.ready { color: #4caf50; background: #1a3a1a; }
        #globalStatus.error { color: #f44336; background: #3a1a1a; }

        details { margin-top: 8px; }
        summary { cursor: pointer; color: #4fc3f7; font-size: 15px; padding: 6px; }
    </style>
</head>
<body>

<h1>📊 VNA Curve Extractor</h1>

<!-- ============ پنل وضعیت کتابخانه‌ها ============ -->
<div id="libStatusPanel">
    <div class="lib-header">
        <span>🔌 وضعیت کتابخانه‌ها</span>
        <span id="libProgress">0/3</span>
    </div>
    <div class="lib-list" id="libList">
        <div class="lib-item pending" data-lib="pyodide"><span class="lib-dot"></span>Pyodide</div>
        <div class="lib-item pending" data-lib="numpy"><span class="lib-dot"></span>NumPy</div>
        <div class="lib-item pending" data-lib="pillow"><span class="lib-dot"></span>Pillow</div>
    </div>
    <div id="globalStatus" class="waiting">⏳ در حال آماده‌سازی...</div>
</div>

<div class="card">
    <h2>مرحله 1: انتخاب تصویر</h2>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInput').click()">
        📷 انتخاب عکس
    </button>
    <div class="status" id="status1">منتظر انتخاب تصویر...</div>

    <!-- تنظیمات Adjustment -->
    <details open>
        <summary>⚙️ تنظیمات تصویر (Adjustment)</summary>
        <div class="inputs" style="margin-top:8px;">
            <div><label>Brightness</label><input type="number" id="adjBrightness" value="-100" step="5"></div>
            <div><label>Exposure</label><input type="number" id="adjExposure" value="100" step="5"></div>
            <div><label>Contrast</label><input type="number" id="adjContrast" value="100" step="5"></div>
            <div><label>Highlights</label><input type="number" id="adjHighlights" value="100" step="5"></div>
            <div><label>Shadows</label><input type="number" id="adjShadows" value="100" step="5"></div>
            <div><label>Saturation</label><input type="number" id="adjSaturation" value="100" step="5"></div>
            <div><label>Sharpness</label><input type="number" id="adjSharpness" value="50" step="5"></div>
        </div>
        <button class="btn btn-warning" onclick="applyAdjustAndReload()" style="margin-top:8px; font-size:14px; padding:10px;">
            🔄 اعمال Adjustment روی تصویر
        </button>
    </details>
</div>

<div class="card" id="clickCard" style="display:none">
    <h2>مرحله 2: کلیک روی نقاط</h2>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="stepInfo">آماده</div>
    <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-warning" onclick="undoLastPoint()" style="flex:1">↩️ لغو</button>
        <button class="btn btn-danger" onclick="resetClicks()" style="flex:1">🔄 شروع مجدد</button>
    </div>
</div>

<div class="card" id="valuesCard" style="display:none">
    <h2>مرحله 3: مقادیر محورها</h2>
    <div class="inputs">
        <div><label>X1 (GHz)</label><input type="number" id="f1" value="8" step="any"></div>
        <div><label>X2 (GHz)</label><input type="number" id="f2" value="12" step="any"></div>
        <div><label>Y1 (dB)</label><input type="number" id="d1" value="0" step="any"></div>
        <div><label>Y2 (dB)</label><input type="number" id="d2" value="-30" step="any"></div>
    </div>

    <div style="margin-top:12px;">
        <label style="font-size:14px; color:#aaa; display:block; margin-bottom:4px;">
            گام خطوط افقی محور عمودی (dB):
        </label>
        <select id="dbStep" style="width:100%; padding:12px; border-radius:6px; background:#1a1a1a; color:#fff; border:1px solid #555; font-size:15px;">
            <option value="10" selected>10 dB</option>
            <option value="20">20 dB</option>
            <option value="30">30 dB</option>
            <option value="5">5 dB</option>
            <option value="1">1 dB</option>
        </select>
    </div>

    <button class="btn btn-success" id="extractBtn" onclick="runExtraction()" style="margin-top:12px">
        ⚡ استخراج
    </button>
    <div class="status" id="status3"></div>
</div>

<div class="card" id="resultCard" style="display:none">
    <h2>مرحله 4: نتیجه</h2>
    <div class="status" id="status4"></div>
    <canvas id="plotCanvas" width="800" height="400"></canvas>
    <button class="btn btn-success" onclick="downloadExcel()" style="margin-top:10px">
        💾 دانلود Excel
    </button>
</div>

<script>
// ============================================================
//   پنل وضعیت کتابخانه‌ها
// ============================================================
const LIB_TOTAL = 3;

function updateLibStatus(name, state, msg) {
    const el = document.querySelector(`.lib-item[data-lib="${name}"]`);
    if (!el) return;
    el.classList.remove('pending', 'loading', 'ok', 'error');
    el.classList.add(state);
    if (msg) {
        el.innerHTML = `<span class="lib-dot"></span>${msg}`;
    }
    if (state === 'ok') {
        const libDone = document.querySelectorAll('.lib-item.ok').length;
        document.getElementById('libProgress').textContent = `${libDone}/${LIB_TOTAL}`;
        if (libDone >= LIB_TOTAL) {
            const g = document.getElementById('globalStatus');
            g.className = 'ready';
            g.textContent = '✅ همه کتابخانه‌ها وصل شدند — آماده استخراج';
        }
    }
    if (state === 'error') {
        const g = document.getElementById('globalStatus');
        g.className = 'error';
        g.textContent = `❌ خطا در بارگذاری ${name}`;
    }
}

window.updateLibStatus = updateLibStatus;
window.markLibLoading = (name) => updateLibStatus(name, 'loading', name + '...');
window.markLibOk = (name) => updateLibStatus(name, 'ok', name + ' ✅');
window.markLibError = (name) => updateLibStatus(name, 'error', name + ' ❌');

// ============================================================
//   Adjustment تصویر
// ============================================================
function applyAdjustments(imgOrCanvas, adj) {
    const c = document.createElement('canvas');
    c.width = imgOrCanvas.width; c.height = imgOrCanvas.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(imgOrCanvas, 0, 0);

    const imgData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imgData.data;

    const brightness = adj.brightness / 100;
    const exposure   = Math.pow(2, adj.exposure / 100);
    const contrastF  = 1 + adj.contrast / 100;
    const highlights = adj.highlights / 100;
    const shadows    = adj.shadows / 100;
    const saturation = 1 + adj.saturation / 100;

    for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];

        r *= exposure; g *= exposure; b *= exposure;
        r += brightness * 255; g += brightness * 255; b += brightness * 255;

        if (highlights !== 1) {
            const lum = 0.299*r + 0.587*g + 0.114*b;
            const t = Math.min(1, lum / 255);
            const factor = 1 - highlights * t * 0.5;
            r *= factor; g *= factor; b *= factor;
        }
        if (shadows !== 1) {
            const lum = 0.299*r + 0.587*g + 0.114*b;
            const t = 1 - Math.min(1, lum / 255);
            const add = shadows * t * 60;
            r += add; g += add; b += add;
        }

        r = (r - 128) * contrastF + 128;
        g = (g - 128) * contrastF + 128;
        b = (b - 128) * contrastF + 128;

        const gray = 0.299*r + 0.587*g + 0.114*b;
        r = gray + (r - gray) * saturation;
        g = gray + (g - gray) * saturation;
        b = gray + (b - gray) * saturation;

        d[i]   = Math.max(0, Math.min(255, r));
        d[i+1] = Math.max(0, Math.min(255, g));
        d[i+2] = Math.max(0, Math.min(255, b));
    }
    ctx.putImageData(imgData, 0, 0);

    const sharpAmount = adj.sharpness / 100;
    if (sharpAmount > 0.01) {
        const w = c.width, h = c.height;
        const src = ctx.getImageData(0, 0, w, h).data;
        const blurred = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let rr=0, gg=0, bb=0, cnt=0;
                for (let dy=-1; dy<=1; dy++) {
                    for (let dx=-1; dx<=1; dx++) {
                        const nx = x+dx, ny = y+dy;
                        if (nx>=0 && nx<w && ny>=0 && ny<h) {
                            const idx = (ny*w + nx)*4;
                            rr += src[idx]; gg += src[idx+1]; bb += src[idx+2]; cnt++;
                        }
                    }
                }
                const i = (y*w + x)*4;
                blurred[i] = rr/cnt; blurred[i+1] = gg/cnt; blurred[i+2] = bb/cnt; blurred[i+3] = 255;
            }
        }
        const out = ctx.createImageData(w, h);
        for (let i = 0; i < src.length; i += 4) {
            out.data[i]   = Math.max(0, Math.min(255, src[i]   + sharpAmount * (src[i]   - blurred[i])));
            out.data[i+1] = Math.max(0, Math.min(255, src[i+1] + sharpAmount * (src[i+1] - blurred[i+1])));
            out.data[i+2] = Math.max(0, Math.min(255, src[i+2] + sharpAmount * (src[i+2] - blurred[i+2])));
            out.data[i+3] = 255;
        }
        ctx.putImageData(out, 0, 0);
    }

    return c;
}

// ============================================================
//   STATE
// ============================================================
const STATE = {
    image: null,
    imageAdjusted: null,
    imageWidth: 0, imageHeight: 0,
    clickStep: 0, corners: [], xPoints: [], yPoints: [],
    allClicks: [], result: null,
    adjValues: { brightness:-100, exposure:100, contrast:100, highlights:100, shadows:100, saturation:100, sharpness:50 }
};

const STEPS_TEXT = [
    'آماده',
    'گوشه بالا-چپ نمودار',
    'گوشه بالا-راست نمودار',
    'گوشه پایین-راست نمودار',
    'گوشه پایین-چپ نمودار',
    'روی 8 GHz کلیک کنید',
    'روی 12 GHz کلیک کنید',
    'روی 0 dB کلیک کنید',
    'روی -30 dB کلیک کنید',
];

// ============================================================
//   بارگذاری فایل
// ============================================================
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            STATE.image = img;
            STATE.imageWidth = img.width;
            STATE.imageHeight = img.height;

            readAdjValuesFromUI();
            applyAdjustAndReload(true);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

function readAdjValuesFromUI() {
    STATE.adjValues = {
        brightness: parseFloat(document.getElementById('adjBrightness').value) || 0,
        exposure:   parseFloat(document.getElementById('adjExposure').value) || 0,
        contrast:   parseFloat(document.getElementById('adjContrast').value) || 0,
        highlights: parseFloat(document.getElementById('adjHighlights').value) || 0,
        shadows:    parseFloat(document.getElementById('adjShadows').value) || 0,
        saturation: parseFloat(document.getElementById('adjSaturation').value) || 0,
        sharpness:  parseFloat(document.getElementById('adjSharpness').value) || 0,
    };
}

// ============================================================
//   رزایز + Adjustment
// ============================================================
function applyAdjustAndReload(silent) {
    if (!STATE.image) {
        if (!silent) alert('اول یک تصویر انتخاب کنید.');
        return;
    }
    readAdjValuesFromUI();

    // ===== رزایز تصویر به حداکثر عرض ۱۲۰۰ پیکسل =====
    // ۱۲۰۰ انتخاب شد چون:
    // - دقت استخراج بالاست (پیکسل‌های کافی برای تشخیص منحنی)
    // - حجم صفحه معقول می‌مونه
    const MAX_WIDTH = 1200;
    let srcW = STATE.image.width;
    let srcH = STATE.image.height;
    let dstW = srcW, dstH = srcH;

    if (srcW > MAX_WIDTH) {
        const ratio = MAX_WIDTH / srcW;
        dstW = MAX_WIDTH;
        dstH = Math.round(srcH * ratio);
    }

    // ساخت canvas موقت برای رزایز
    const resizeCanvas = document.createElement('canvas');
    resizeCanvas.width = dstW;
    resizeCanvas.height = dstH;
    const resizeCtx = resizeCanvas.getContext('2d');
    resizeCtx.imageSmoothingEnabled = true;
    resizeCtx.imageSmoothingQuality = 'high';
    resizeCtx.drawImage(STATE.image, 0, 0, dstW, dstH);

    // اعمال Adjustment روی تصویر رزایز شده
    STATE.imageAdjusted = applyAdjustments(resizeCanvas, STATE.adjValues);

    // نمایش روی canvas اصلی
    const canvas = document.getElementById('canvas');
    canvas.width = STATE.imageAdjusted.width;
    canvas.height = STATE.imageAdjusted.height;
    canvas.getContext('2d').drawImage(STATE.imageAdjusted, 0, 0);

    // به‌روزرسانی ابعاد برای پایتون
    STATE.imageWidth = STATE.imageAdjusted.width;
    STATE.imageHeight = STATE.imageAdjusted.height;
    window.imageWidth = STATE.imageAdjusted.width;
    window.imageHeight = STATE.imageAdjusted.height;

    STATE.clickStep = 1;
    STATE.corners = []; STATE.xPoints = []; STATE.yPoints = [];
    STATE.allClicks = [];

    document.getElementById('clickCard').style.display = 'block';
    document.getElementById('valuesCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('status1').textContent =
        `✅ ${STATE.imageAdjusted.width}×${STATE.imageAdjusted.height} (رزایز + Adjustment)`;
    document.getElementById('stepInfo').textContent = STEPS_TEXT[1];
}

// ============================================================
//   کلیک روی canvas
// ============================================================
document.getElementById('canvas').addEventListener('click', function(e) {
    if (STATE.clickStep < 1) return;
    const canvas = document.getElementById('canvas');
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * canvas.width / rect.width;
    const y = (e.clientY - rect.top) * canvas.height / rect.height;
    handleClick(x, y);
});

function handleClick(x, y) {
    const step = STATE.clickStep;
    STATE.allClicks.push({x, y, step});
    let color = 'red', label = '';
    if (step >= 1 && step <= 4) {
        STATE.corners.push({x, y});
        color = ['red', 'green', 'blue', 'orange'][step - 1];
        label = ['TL', 'TR', 'BR', 'BL'][step - 1];
    } else if (step === 5 || step === 6) {
        STATE.xPoints.push({x, y});
        color = 'magenta';
        label = step === 5 ? 'X1' : 'X2';
    } else if (step === 7 || step === 8) {
        STATE.yPoints.push({x, y});
        color = 'cyan';
        label = step === 7 ? 'Y1' : 'Y2';
    }
    drawMarker(x, y, color, label);
    STATE.clickStep++;
    if (STATE.clickStep <= 8) {
        document.getElementById('stepInfo').textContent = STEPS_TEXT[STATE.clickStep];
    }
    if (STATE.clickStep === 7) {
        document.getElementById('valuesCard').style.display = 'block';
    }
    if (STATE.clickStep === 9) {
        document.getElementById('stepInfo').textContent = '✅ همه نقاط آماده!';
    }
}

function drawMarker(x, y, color, label) {
    const ctx = document.getElementById('canvas').getContext('2d');
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, 2 * Math.PI);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
    if (label) {
        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + 5);
    }
}

function undoLastPoint() {
    if (STATE.allClicks.length === 0) return;
    const last = STATE.allClicks.pop();
    STATE.clickStep = last.step;
    if (last.step >= 1 && last.step <= 4) STATE.corners.pop();
    else if (last.step === 5 || last.step === 6) STATE.xPoints.pop();
    else if (last.step === 7 || last.step === 8) STATE.yPoints.pop();
    const canvas = document.getElementById('canvas');
    canvas.getContext('2d').drawImage(STATE.imageAdjusted, 0, 0);
    redrawAllMarkers();
}

function redrawAllMarkers() {
    for (let i = 0; i < STATE.corners.length; i++) {
        const c = STATE.corners[i];
        drawMarker(c.x, c.y, ['red','green','blue','orange'][i], ['TL','TR','BR','BL'][i]);
    }
    for (let i = 0; i < STATE.xPoints.length; i++) {
        const p = STATE.xPoints[i];
        drawMarker(p.x, p.y, 'magenta', i === 0 ? 'X1' : 'X2');
    }
    for (let i = 0; i < STATE.yPoints.length; i++) {
        const p = STATE.yPoints[i];
        drawMarker(p.x, p.y, 'cyan', i === 0 ? 'Y1' : 'Y2');
    }
}

function resetClicks() {
    STATE.clickStep = 1;
    STATE.corners = []; STATE.xPoints = []; STATE.yPoints = []; STATE.allClicks = [];
    document.getElementById('canvas').getContext('2d').drawImage(STATE.imageAdjusted, 0, 0);
    document.getElementById('stepInfo').textContent = STEPS_TEXT[1];
    document.getElementById('valuesCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
}

// ============================================================
//   استخراج
// ============================================================
async function runExtraction() {
    if (typeof window.process_image !== 'function') {
        document.getElementById('status3').textContent =
            '⏳ لطفاً صبر کنید (نصب پکیج‌ها)';
        return;
    }

    document.getElementById('status3').textContent = '⏳ در حال استخراج...';
    document.getElementById('extractBtn').disabled = true;
    try {
        const corners = STATE.corners.map(p => [p.x, p.y]);
        const calib = {
            x1: STATE.xPoints[0].x,
            f1: parseFloat(document.getElementById('f1').value),
            x2: STATE.xPoints[1].x,
            f2: parseFloat(document.getElementById('f2').value),
            y1: STATE.yPoints[0].y,
            d1: parseFloat(document.getElementById('d1').value),
            y2: STATE.yPoints[1].y,
            d2: parseFloat(document.getElementById('d2').value),
            db_step: parseFloat(document.getElementById('dbStep').value)
        };
        const imgArray = await imageToArray(STATE.imageAdjusted);

        let resultRaw = await window.process_image(imgArray, corners, calib);

        let result;
        if (typeof resultRaw === 'string') {
            result = JSON.parse(resultRaw);
        } else if (resultRaw && typeof resultRaw.toJs === 'function') {
            result = resultRaw.toJs({dict_converter: Object.fromEntries});
        } else {
            result = resultRaw;
        }

        STATE.result = result;
        showResult(result);
        document.getElementById('status3').textContent = `✅ ${result.frequency.length} نقطه`;
    } catch (err) {
        console.error(err);
        document.getElementById('status3').textContent = '❌ ' + (err.message || err);
    }
    document.getElementById('extractBtn').disabled = false;
}

function imageToArray(imgOrCanvas) {
    return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = imgOrCanvas.width;
        canvas.height = imgOrCanvas.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgOrCanvas, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const arr = new Uint8Array(canvas.width * canvas.height * 3);
        for (let i = 0; i < canvas.width * canvas.height; i++) {
            arr[i * 3] = data[i * 4];
            arr[i * 3 + 1] = data[i * 4 + 1];
            arr[i * 3 + 2] = data[i * 4 + 2];
        }
        resolve(arr);
    });
}

function showResult(result) {
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('status4').textContent =
        `${result.frequency.length} نقطه`;
    const canvas = document.getElementById('plotCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, pad = 60;
    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, W, H);
    const xs = result.frequency, ys = result.amplitude;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const yPad = (yMax - yMin) * 0.1 || 1;
    const yLo = yMin - yPad, yHi = yMax + yPad;
    const px = (x) => pad + (x - xMin) / (xMax - xMin) * (W - 2 * pad);
    const py = (y) => H - pad - (y - yLo) / (yHi - yLo) * (H - 2 * pad);
    ctx.strokeStyle = '#ccc';
    for (let i = 0; i <= 5; i++) {
        const y = yLo + (yHi - yLo) * i / 5;
        ctx.beginPath(); ctx.moveTo(pad, py(y)); ctx.lineTo(W - pad, py(y)); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.font = '13px Arial'; ctx.textAlign = 'right';
        ctx.fillText(y.toFixed(1), pad - 6, py(y) + 5);
    }
    for (let i = 0; i <= 4; i++) {
        const x = xMin + (xMax - xMin) * i / 4;
        ctx.beginPath(); ctx.moveTo(px(x), pad); ctx.lineTo(px(x), H - pad); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(x.toFixed(2), px(x), H - pad + 18);
    }
    ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), py(ys[0]));
    for (let i = 1; i < xs.length; i++) ctx.lineTo(px(xs[i]), py(ys[i]));
    ctx.stroke();
}

function downloadExcel() {
    if (!STATE.result) return;
    const xs = STATE.result.frequency;
    const ys = STATE.result.amplitude;
    const data = [['Frequency_GHz', 'Amplitude_dB']];
    for (let i = 0; i < xs.length; i++) data.push([xs[i], ys[i]]);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 18 }, { wch: 18 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Curve');
    XLSX.writeFile(wb, 'vna_curve.xlsx');
}
