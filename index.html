<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNA Curve Extractor</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="./libs/pyscript/core.css">
    <script type="module" src="./libs/pyscript/core.js"></script>
    <script src="./libs/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            margin: 0; padding: 8px;
            background: #1a1a1a; color: #eee;
            font-size: 16px;
        }
        h1 { font-size: 24px; text-align: center; color: #4fc3f7; margin: 10px 0; }
        .card {
            background: #2a2a2a; border-radius: 10px;
            padding: 12px; margin-bottom: 10px; border: 1px solid #444;
        }
        .card h2 { font-size: 18px; margin: 0 0 10px 0; color: #ffd54f; }
        .btn {
            background: #2196f3; color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px;
            cursor: pointer; width: 100%; margin: 4px 0;
        }
        .btn:active { background: #1976d2; }
        .btn:disabled { background: #555; }
        .btn-success { background: #4caf50; }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }

        .canvas-wrap {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }
        #canvas { display: block; width: 100%; height: auto; cursor: crosshair; }

        .status {
            background: #333; padding: 10px; border-radius: 6px;
            font-size: 15px; text-align: center; margin-top: 6px; color: #4fc3f7;
        }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .inputs label { font-size: 14px; color: #aaa; display: block; margin-bottom: 4px; }
        .inputs input, .inputs select {
            width: 100%; padding: 10px; border: 1px solid #555;
            border-radius: 6px; background: #1a1a1a; color: #fff;
            text-align: center; font-size: 15px;
        }
        #stepInfo {
            font-size: 16px; color: #ffd54f; text-align: center;
            padding: 8px; background: #1a1a1a; border-radius: 6px; margin-top: 8px;
        }
        #plotCanvas { width: 100%; background: #fff; border-radius: 8px; display: block; }

        #globalStatus {
            text-align: center;
            font-weight: bold;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        #globalStatus.waiting { color: #ffd54f; background: #3a2a1a; border-color: #ffd54f; }
        #globalStatus.ready { color: #4caf50; background: #1a3a1a; border-color: #4caf50; }
        #globalStatus.error { color: #f44336; background: #3a1a1a; border-color: #f44336; }

        details { margin-top: 8px; }
        summary { cursor: pointer; color: #4fc3f7; font-size: 15px; padding: 6px; }

        .helper-tip {
            background: #1a2a3a;
            color: #4fc3f7;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>📊 VNA Curve Extractor</h1>

<div id="globalStatus" class="waiting">⏳ در حال آماده‌سازی...</div>

<div class="card">
    <h2>مرحله 1: انتخاب تصویر</h2>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button class="btn" onclick="document.getElementById('fileInput').click()">
        📷 انتخاب عکس
    </button>
    <div class="status" id="status1">منتظر انتخاب تصویر...</div>

    <details open>
        <summary>⚙️ تنظیمات تصویر (Adjustment)</summary>
        <div class="inputs" style="margin-top:8px;">
            <div><label>Brightness</label><input type="number" id="adjBrightness" value="-100" step="5"></div>
            <div><label>Exposure</label><input type="number" id="adjExposure" value="100" step="5"></div>
            <div><label>Contrast</label><input type="number" id="adjContrast" value="100" step="5"></div>
            <div><label>Highlights</label><input type="number" id="adjHighlights" value="100" step="5"></div>
            <div><label>Shadows</label><input type="number" id="adjShadows" value="100" step="5"></div>
            <div><label>Saturation</label><input type="number" id="adjSaturation" value="100" step="5"></div>
            <div><label>Sharpness</label><input type="number" id="adjSharpness" value="50" step="5"></div>
        </div>
        <button class="btn btn-warning" onclick="applyAdjustAndReload()" style="margin-top:8px; font-size:14px; padding:10px;">
            🔄 اعمال Adjustment روی تصویر
        </button>
    </details>
</div>

<div class="card" id="clickCard" style="display:none">
    <h2>مرحله 2: رسم ۵ خط راهنما</h2>
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="stepInfo">آماده</div>
    <div class="helper-tip">💡 بعد از رسم هر خط، می‌تونی اون رو با ماوس/انگشت بگیری و جابه‌جا کنی</div>
    <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-warning" onclick="undoLastLine()" style="flex:1">↩️ لغو</button>
        <button class="btn btn-danger" onclick="resetLines()" style="flex:1">🔄 شروع مجدد</button>
    </div>
</div>

<div class="card" id="valuesCard" style="display:none">
    <h2>مرحله 3: مقادیر محورها</h2>
    <div class="inputs">
        <div><label>X1 (GHz) - خط عمودی چپ</label><input type="number" id="f1" value="8" step="any"></div>
        <div><label>X2 (GHz) - خط عمودی راست</label><input type="number" id="f2" value="12" step="any"></div>
        <div><label>Y_top (dB) - خط افقی بالا</label><input type="number" id="d_top" value="0" step="any"></div>
        <div><label>Y_mid (dB) - خط افقی وسط</label><input type="number" id="d_mid" value="-30" step="any"></div>
        <div><label>Y_bot (dB) - خط افقی پایین</label><input type="number" id="d_bot" value="-50" step="any"></div>
    </div>

    <div style="margin-top:12px;">
        <label style="font-size:14px; color:#aaa; display:block; margin-bottom:4px;">
            گام خطوط افقی محور عمودی (dB):
        </label>
        <select id="dbStep" style="width:100%; padding:12px; border-radius:6px; background:#1a1a1a; color:#fff; border:1px solid #555; font-size:15px;">
            <option value="10" selected>10 dB</option>
            <option value="20">20 dB</option>
            <option value="30">30 dB</option>
            <option value="5">5 dB</option>
            <option value="1">1 dB</option>
        </select>
    </div>

    <button class="btn btn-success" id="extractBtn" onclick="runExtraction()" style="margin-top:12px">
        ⚡ استخراج
    </button>
    <div class="status" id="status3"></div>
</div>

<div class="card" id="resultCard" style="display:none">
    <h2>مرحله 4: نتیجه</h2>
    <div class="status" id="status4"></div>
    <canvas id="plotCanvas" width="800" height="400"></canvas>
    <button class="btn btn-success" onclick="downloadExcel()" style="margin-top:10px">
        💾 دانلود Excel
    </button>
</div>

<script>
// ============================================================
//   کادر وضعیت
// ============================================================
const LIB_TOTAL = 3;
let libOkCount = 0;

function setGlobalStatus(state, text) {
    const g = document.getElementById('globalStatus');
    g.className = state;
    g.textContent = text;
}

window.markLibLoading = (name) => console.log(`[lib] ${name} → loading`);
window.markLibOk = (name) => {
    console.log(`[lib] ${name} → OK`);
    libOkCount++;
    if (libOkCount >= LIB_TOTAL) {
        setGlobalStatus('ready', '✅ کتابخانه‌ها با موفقیت وصل شدند');
    }
};
window.markLibError = (name) => {
    console.error(`[lib] ${name} → ERROR`);
    setGlobalStatus('error', `❌ خطا در بارگذاری ${name} (کنسول را ببینید)`);
};

// ============================================================
//   Adjustment تصویر
// ============================================================
function applyAdjustments(imgOrCanvas, adj) {
    const c = document.createElement('canvas');
    c.width = imgOrCanvas.width; c.height = imgOrCanvas.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(imgOrCanvas, 0, 0);

    const imgData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imgData.data;

    const brightness = adj.brightness / 100;
    const exposure   = Math.pow(2, adj.exposure / 100);
    const contrastF  = 1 + adj.contrast / 100;
    const highlights = adj.highlights / 100;
    const shadows    = adj.shadows / 100;
    const saturation = 1 + adj.saturation / 100;

    for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];
        r *= exposure; g *= exposure; b *= exposure;
        r += brightness * 255; g += brightness * 255; b += brightness * 255;

        if (highlights !== 1) {
            const lum = 0.299*r + 0.587*g + 0.114*b;
            const t = Math.min(1, lum / 255);
            const factor = 1 - highlights * t * 0.5;
            r *= factor; g *= factor; b *= factor;
        }
        if (shadows !== 1) {
            const lum = 0.299*r + 0.587*g + 0.114*b;
            const t = 1 - Math.min(1, lum / 255);
            const add = shadows * t * 60;
            r += add; g += add; b += add;
        }

        r = (r - 128) * contrastF + 128;
        g = (g - 128) * contrastF + 128;
        b = (b - 128) * contrastF + 128;

        const gray = 0.299*r + 0.587*g + 0.114*b;
        r = gray + (r - gray) * saturation;
        g = gray + (g - gray) * saturation;
        b = gray + (b - gray) * saturation;

        d[i]   = Math.max(0, Math.min(255, r));
        d[i+1] = Math.max(0, Math.min(255, g));
        d[i+2] = Math.max(0, Math.min(255, b));
    }
    ctx.putImageData(imgData, 0, 0);

    const sharpAmount = adj.sharpness / 100;
    if (sharpAmount > 0.01) {
        const w = c.width, h = c.height;
        const src = ctx.getImageData(0, 0, w, h).data;
        const blurred = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let rr=0, gg=0, bb=0, cnt=0;
                for (let dy=-1; dy<=1; dy++) {
                    for (let dx=-1; dx<=1; dx++) {
                        const nx = x+dx, ny = y+dy;
                        if (nx>=0 && nx<w && ny>=0 && ny<h) {
                            const idx = (ny*w + nx)*4;
                            rr += src[idx]; gg += src[idx+1]; bb += src[idx+2]; cnt++;
                        }
                    }
                }
                const i = (y*w + x)*4;
                blurred[i] = rr/cnt; blurred[i+1] = gg/cnt; blurred[i+2] = bb/cnt; blurred[i+3] = 255;
            }
        }
        const out = ctx.createImageData(w, h);
        for (let i = 0; i < src.length; i += 4) {
            out.data[i]   = Math.max(0, Math.min(255, src[i]   + sharpAmount * (src[i]   - blurred[i])));
            out.data[i+1] = Math.max(0, Math.min(255, src[i+1] + sharpAmount * (src[i+1] - blurred[i+1])));
            out.data[i+2] = Math.max(0, Math.min(255, src[i+2] + sharpAmount * (src[i+2] - blurred[i+2])));
            out.data[i+3] = 255;
        }
        ctx.putImageData(out, 0, 0);
    }

    return c;
}

// ============================================================
//   STATE
// ============================================================
const STATE = {
    image: null,
    imageAdjusted: null,
    imageWidth: 0, imageHeight: 0,
    lineStep: 0,
    lines: [],
    allLines: [],
    result: null,
    adjValues: {},
    dragging: null,
    dragTolerance: 15,
    mouseDown: false,
    mouseDownPos: null,
    touchPending: null
};

const LINE_STEPS_TEXT = [
    'آماده',
    'خط عمودی سمت چپ نمودار (شروع فرکانس)',
    'خط عمودی سمت راست نمودار (پایان فرکانس)',
    'خط افقی بالای نمودار (Y_top)',
    'خط افقی وسط نمودار (Y_mid)',
    'خط افقی پایین نمودار (Y_bot)',
];

const LINE_COLORS = ['#ff0000', '#00ff00', '#ff00ff', '#00ffff', '#ffff00'];
const LINE_LABELS = ['V1', 'V2', 'H1', 'H2', 'H3'];

// ============================================================
//   بارگذاری فایل
// ============================================================
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            STATE.image = img;
            STATE.imageWidth = img.width;
            STATE.imageHeight = img.height;
            readAdjValuesFromUI();
            applyAdjustAndReload(true);
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

function readAdjValuesFromUI() {
    STATE.adjValues = {
        brightness: parseFloat(document.getElementById('adjBrightness').value) || 0,
        exposure:   parseFloat(document.getElementById('adjExposure').value) || 0,
        contrast:   parseFloat(document.getElementById('adjContrast').value) || 0,
        highlights: parseFloat(document.getElementById('adjHighlights').value) || 0,
        shadows:    parseFloat(document.getElementById('adjShadows').value) || 0,
        saturation: parseFloat(document.getElementById('adjSaturation').value) || 0,
        sharpness:  parseFloat(document.getElementById('adjSharpness').value) || 0,
    };
}

function applyAdjustAndReload(silent) {
    if (!STATE.image) {
        if (!silent) alert('اول یک تصویر انتخاب کنید.');
        return;
    }
    readAdjValuesFromUI();

    const MAX_WIDTH = 1200;
    let srcW = STATE.image.width, srcH = STATE.image.height;
    let dstW = srcW, dstH = srcH;
    if (srcW > MAX_WIDTH) {
        const ratio = MAX_WIDTH / srcW;
        dstW = MAX_WIDTH;
        dstH = Math.round(srcH * ratio);
    }

    const resizeCanvas = document.createElement('canvas');
    resizeCanvas.width = dstW;
    resizeCanvas.height = dstH;
    const resizeCtx = resizeCanvas.getContext('2d');
    resizeCtx.imageSmoothingEnabled = true;
    resizeCtx.imageSmoothingQuality = 'high';
    resizeCtx.drawImage(STATE.image, 0, 0, dstW, dstH);

    STATE.imageAdjusted = applyAdjustments(resizeCanvas, STATE.adjValues);

    const canvas = document.getElementById('canvas');
    canvas.width = STATE.imageAdjusted.width;
    canvas.height = STATE.imageAdjusted.height;
    canvas.getContext('2d').drawImage(STATE.imageAdjusted, 0, 0);

    STATE.imageWidth = STATE.imageAdjusted.width;
    STATE.imageHeight = STATE.imageAdjusted.height;
    window.imageWidth = STATE.imageAdjusted.width;
    window.imageHeight = STATE.imageAdjusted.height;

    STATE.lineStep = 1;
    STATE.lines = []; STATE.allLines = [];

    document.getElementById('clickCard').style.display = 'block';
    document.getElementById('valuesCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('status1').textContent =
        `✅ ${STATE.imageAdjusted.width}×${STATE.imageAdjusted.height}`;
    document.getElementById('stepInfo').textContent = LINE_STEPS_TEXT[1];
}

// ============================================================
//   رسم خطوط + Drag
// ============================================================
const canvas = document.getElementById('canvas');

function findLineAt(x, y) {
    for (let i = STATE.lines.length - 1; i >= 0; i--) {
        const line = STATE.lines[i];
        if (line.type === 'vertical') {
            if (Math.abs(x - line.x) <= STATE.dragTolerance) return i;
        } else {
            if (Math.abs(y - line.y) <= STATE.dragTolerance) return i;
        }
    }
    return -1;
}

function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * canvas.width / rect.width;
    const y = (e.clientY - rect.top) * canvas.height / rect.height;
    return {x, y};
}

canvas.addEventListener('mousedown', function(e) {
    const {x, y} = getCanvasCoords(e);
    STATE.mouseDown = true;
    STATE.mouseDownPos = {x, y};

    const lineIdx = findLineAt(x, y);
    if (lineIdx >= 0) {
        const line = STATE.lines[lineIdx];
        STATE.dragging = {
            lineIndex: lineIdx,
            offset: line.type === 'vertical' ? (x - line.x) : (y - line.y)
        };
        canvas.style.cursor = line.type === 'vertical' ? 'ew-resize' : 'ns-resize';
    }
});

canvas.addEventListener('mousemove', function(e) {
    const {x, y} = getCanvasCoords(e);

    if (STATE.dragging) {
        const line = STATE.lines[STATE.dragging.lineIndex];
        if (line.type === 'vertical') {
            line.x = x - STATE.dragging.offset;
            line.x = Math.max(0, Math.min(canvas.width, line.x));
        } else {
            line.y = y - STATE.dragging.offset;
            line.y = Math.max(0, Math.min(canvas.height, line.y));
        }
        redrawCanvas();
        return;
    }

    if (STATE.mouseDown) return;
    const lineIdx = findLineAt(x, y);
    if (lineIdx >= 0) {
        const line = STATE.lines[lineIdx];
        canvas.style.cursor = line.type === 'vertical' ? 'ew-resize' : 'ns-resize';
    } else {
        canvas.style.cursor = STATE.lineStep <= 5 ? 'crosshair' : 'default';
    }
});

canvas.addEventListener('mouseup', function(e) {
    const wasDragging = STATE.dragging !== null;
    STATE.mouseDown = false;

    if (!wasDragging && STATE.lineStep >= 1 && STATE.lineStep <= 5) {
        const {x, y} = getCanvasCoords(e);
        const lineIdx = findLineAt(x, y);
        if (lineIdx < 0) {
            handleLineClick(x, y);
        }
    }

    STATE.dragging = null;
    STATE.mouseDownPos = null;
    canvas.style.cursor = STATE.lineStep <= 5 ? 'crosshair' : 'default';
});

canvas.addEventListener('mouseleave', function() {
    STATE.dragging = null;
    STATE.mouseDown = false;
});

canvas.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * canvas.width / rect.width;
    const y = (touch.clientY - rect.top) * canvas.height / rect.height;

    STATE.mouseDown = true;
    const lineIdx = findLineAt(x, y);
    if (lineIdx >= 0) {
        const line = STATE.lines[lineIdx];
        STATE.dragging = {
            lineIndex: lineIdx,
            offset: line.type === 'vertical' ? (x - line.x) : (y - line.y)
        };
    } else {
        STATE.dragging = null;
        STATE.touchPending = {x, y};
    }
}, {passive: false});

canvas.addEventListener('touchmove', function(e) {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * canvas.width / rect.width;
    const y = (touch.clientY - rect.top) * canvas.height / rect.height;

    if (STATE.dragging) {
        const line = STATE.lines[STATE.dragging.lineIndex];
        if (line.type === 'vertical') {
            line.x = Math.max(0, Math.min(canvas.width, x - STATE.dragging.offset));
        } else {
            line.y = Math.max(0, Math.min(canvas.height, y - STATE.dragging.offset));
        }
        redrawCanvas();
    }
}, {passive: false});

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!STATE.dragging && STATE.touchPending && STATE.lineStep >= 1 && STATE.lineStep <= 5) {
        handleLineClick(STATE.touchPending.x, STATE.touchPending.y);
    }
    STATE.dragging = null;
    STATE.mouseDown = false;
    STATE.touchPending = null;
}, {passive: false});

function handleLineClick(x, y) {
    const step = STATE.lineStep;
    if (step < 1 || step > 5) return;

    const type = (step <= 2) ? 'vertical' : 'horizontal';
    const line = {
        type, x, y, step,
        color: LINE_COLORS[step - 1],
        label: LINE_LABELS[step - 1]
    };
    STATE.lines.push(line);
    STATE.allLines.push(line);
    redrawCanvas();

    STATE.lineStep++;
    if (STATE.lineStep <= 5) {
        document.getElementById('stepInfo').textContent = LINE_STEPS_TEXT[STATE.lineStep];
    }
    if (STATE.lineStep === 3) {
        document.getElementById('valuesCard').style.display = 'block';
    }
    if (STATE.lineStep === 6) {
        document.getElementById('stepInfo').textContent = '✅ همه خطوط رسم شدند! (می‌تونی جابه‌جا کنی)';
        canvas.style.cursor = 'default';
    }
}

function redrawCanvas() {
    const ctx = canvas.getContext('2d');
    ctx.drawImage(STATE.imageAdjusted, 0, 0);
    for (const line of STATE.lines) drawLine(line);
}

function drawLine(line) {
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 5;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    if (line.type === 'vertical') {
        ctx.moveTo(line.x, 0);
        ctx.lineTo(line.x, canvas.height);
    } else {
        ctx.moveTo(0, line.y);
        ctx.lineTo(canvas.width, line.y);
    }
    ctx.stroke();

    ctx.strokeStyle = line.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (line.type === 'vertical') {
        ctx.moveTo(line.x, 0);
        ctx.lineTo(line.x, canvas.height);
    } else {
        ctx.moveTo(0, line.y);
        ctx.lineTo(canvas.width, line.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = line.color;
    ctx.font = 'bold 16px Arial';
    if (line.type === 'vertical') {
        ctx.textAlign = 'center';
        ctx.fillText(line.label, line.x, 20);
    } else {
        ctx.textAlign = 'left';
        ctx.fillText(line.label, 10, line.y - 5);
    }
}

function undoLastLine() {
    if (STATE.allLines.length === 0) return;
    const last = STATE.allLines.pop();
    STATE.lineStep = last.step;
    for (let i = STATE.lines.length - 1; i >= 0; i--) {
        if (STATE.lines[i].step === last.step) {
            STATE.lines.splice(i, 1);
            break;
        }
    }
    redrawCanvas();
    document.getElementById('stepInfo').textContent = LINE_STEPS_TEXT[STATE.lineStep];
    if (STATE.lineStep < 3) {
        document.getElementById('valuesCard').style.display = 'none';
    }
    canvas.style.cursor = STATE.lineStep <= 5 ? 'crosshair' : 'default';
}

function resetLines() {
    STATE.lineStep = 1;
    STATE.lines = []; STATE.allLines = [];
    redrawCanvas();
    document.getElementById('stepInfo').textContent = LINE_STEPS_TEXT[1];
    document.getElementById('valuesCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    canvas.style.cursor = 'crosshair';
}

// ============================================================
//   استخراج
// ============================================================
async function runExtraction() {
    if (STATE.lines.length < 5) {
        document.getElementById('status3').textContent = '❌ ابتدا ۵ خط را رسم کنید';
        return;
    }
    if (typeof window.process_image !== 'function') {
        document.getElementById('status3').textContent = '⏳ لطفاً صبر کنید (نصب پکیج‌ها)';
        return;
    }

    document.getElementById('status3').textContent = '⏳ در حال استخراج...';
    document.getElementById('extractBtn').disabled = true;
    try {
        const vLines = STATE.lines.filter(l => l.type === 'vertical').sort((a,b) => a.x - b.x);
        const hLines = STATE.lines.filter(l => l.type === 'horizontal').sort((a,b) => a.y - b.y);

        const calib = {
            x1: vLines[0].x,
            f1: parseFloat(document.getElementById('f1').value),
            x2: vLines[1].x,
            f2: parseFloat(document.getElementById('f2').value),
            y_top: hLines[0].y,
            d_top: parseFloat(document.getElementById('d_top').value),
            y_mid: hLines[1].y,
            d_mid: parseFloat(document.getElementById('d_mid').value),
            y_bot: hLines[2].y,
            d_bot: parseFloat(document.getElementById('d_bot').value),
            db_step: parseFloat(document.getElementById('dbStep').value)
        };

        const corners = [
            [vLines[0].x, hLines[0].y],
            [vLines[1].x, hLines[0].y],
            [vLines[1].x, hLines[2].y],
            [vLines[0].x, hLines[2].y],
        ];

        const imgArray = await imageToArray(STATE.imageAdjusted);
        let resultRaw = await window.process_image(imgArray, corners, calib);

        let result;
        if (typeof resultRaw === 'string') {
            result = JSON.parse(resultRaw);
        } else if (resultRaw && typeof resultRaw.toJs === 'function') {
            result = resultRaw.toJs({dict_converter: Object.fromEntries});
        } else {
            result = resultRaw;
        }

        STATE.result = result;
        showResult(result);
        document.getElementById('status3').textContent = `✅ ${result.frequency.length} نقطه`;
    } catch (err) {
        console.error(err);
        document.getElementById('status3').textContent = '❌ ' + (err.message || err);
    }
    document.getElementById('extractBtn').disabled = false;
}

function imageToArray(imgOrCanvas) {
    return new Promise((resolve) => {
        const c = document.createElement('canvas');
        c.width = imgOrCanvas.width;
        c.height = imgOrCanvas.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(imgOrCanvas, 0, 0);
        const imgData = ctx.getImageData(0, 0, c.width, c.height);
        const data = imgData.data;
        const arr = new Uint8Array(c.width * c.height * 3);
        for (let i = 0; i < c.width * c.height; i++) {
            arr[i * 3] = data[i * 4];
            arr[i * 3 + 1] = data[i * 4 + 1];
            arr[i * 3 + 2] = data[i * 4 + 2];
        }
        resolve(arr);
    });
}

function showResult(result) {
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('status4').textContent = `${result.frequency.length} نقطه`;
    const c = document.getElementById('plotCanvas');
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height, pad = 60;
    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, W, H);
    const xs = result.frequency, ys = result.amplitude;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const yPad = (yMax - yMin) * 0.1 || 1;
    const yLo = yMin - yPad, yHi = yMax + yPad;
    const px = (x) => pad + (x - xMin) / (xMax - xMin) * (W - 2 * pad);
    const py = (y) => H - pad - (y - yLo) / (yHi - yLo) * (H - 2 * pad);
    ctx.strokeStyle = '#ccc';
    for (let i = 0; i <= 5; i++) {
        const y = yLo + (yHi - yLo) * i / 5;
        ctx.beginPath(); ctx.moveTo(pad, py(y)); ctx.lineTo(W - pad, py(y)); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.font = '13px Arial'; ctx.textAlign = 'right';
        ctx.fillText(y.toFixed(1), pad - 6, py(y) + 5);
    }
    for (let i = 0; i <= 4; i++) {
        const x = xMin + (xMax - xMin) * i / 4;
        ctx.beginPath(); ctx.moveTo(px(x), pad); ctx.lineTo(px(x), H - pad); ctx.stroke();
        ctx.fillStyle = '#333'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(x.toFixed(2), px(x), H - pad + 18);
    }
    ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px(xs[0]), py(ys[0]));
    for (let i = 1; i < xs.length; i++) ctx.lineTo(px(xs[i]), py(ys[i]));
    ctx.stroke();
}

function downloadExcel() {
    if (!STATE.result) return;
    const xs = STATE.result.frequency;
    const ys = STATE.result.amplitude;
    const data = [['Frequency_GHz', 'Amplitude_dB']];
    for (let i = 0; i < xs.length; i++) data.push([xs[i], ys[i]]);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 18 }, { wch: 18 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Curve');
    XLSX.writeFile(wb, 'vna_curve.xlsx');
}
